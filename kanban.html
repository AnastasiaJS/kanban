<!DOCTYPE html>
<html lang="en">

<body>
    <div class="container">
        <div class="kanban-heading">
            <strong class="kanban-heading-text">任务看板</strong>
        </div>

        <div class="kanban-board">
            <div class="task-block" id="unclassified">
                <strong style="color:#fff">未分类</strong>
                <div class="task-button-block">
                    <button id="task-button" onclick="toggleModal(event,true)">新建任务
                </div>
            </div>
            <div class="kanban">
                <div class="kanban-block" id="todo" ondrop="drop(event,'0')" ondragover="allowDrop(event)">
                    <strong>未开始</strong>
                </div>
                <div class="kanban-block" id="inprogress" ondrop="drop(event,'1')" ondragover="allowDrop(event)">
                    <strong>进行中</strong>
                </div>
                <div class="kanban-block" id="done" ondrop="drop(event,'2')" ondragover="allowDrop(event)">
                    <strong>已完成</strong>
                </div>
            </div>
        </div>

    </div>

<script type="module">
    import { openDB, addData, deleteData, getIndexData, updateData } from './indexDB.js';
    import { drawPieChart } from './pieChart.js';
    window.dbName = 'kanbanDB';
    window.dbVersion = 1;
    window.dbStoreName = 'taskStore';
    const res = await openDB(dbName, dbVersion, dbStoreName, 'id', [
        { indexName: 'id', indexKey: 'id', options: { unique: true } },
        { indexName: 'status', indexKey: 'status', options: { unique: false } },
        { indexName: 'name', indexKey: 'name', options: { unique: false } },
        { indexName: 'detail', indexKey: 'detail', options: { unique: false } },
        { indexName: 'task_begin', indexKey: 'task_begin', options: { unique: false } },
        { indexName: 'task_end', indexKey: 'task_end', options: { unique: false } },
    ]);
    window.db = res.success && res.data
    window.addData = addData
    window.deleteData = deleteData
    window.getIndexData = getIndexData
    window.updateData = updateData
    window.drawPieChart = drawPieChart
    getAllDatas()

</script>

<script>
    window.onload = function () {

    }
    /**
     * 格式化时间
     * @param {string} dateTime 时间字符串
     * @returns {string} 格式化后的时间字符串
     */
    function formatTime (dateTime = new Date()) {
        // 丢失时区信息 加上8小时
        dateTime = new Date(+dateTime + 8 * 3600 * 1000)
        return new Date(dateTime).toISOString().replace(/T/g, ' ').slice(0, 16)
    }
    /**
     * 添加任务DOM
     * @param {Object} data 任务数据
     * @param {string} domId 目标DOM ID
     */
    function addTaskDom (data, domId = 'unclassified') {
        const child = document.createElement('div')
        child.className = 'task'
        child.draggable = true
        child.ondragstart = drag
        child.id = data.id
        child.setAttribute('data-status', data.status)
        child.setAttribute('data-detail', data.detail)
        child.setAttribute('data-name', data.name)
        child.setAttribute('data-begin', data.task_begin)
        child.setAttribute('data-end', data.task_end)
        // child.innerHTML = `<span>${data.detail}</span>`
        child.innerHTML = `<div class='item-title'>${data.detail}</div>
                    <div class='delete' onclick='deleteTask(event,${data.status},${data.id})'>删除</div>
                    <div class='item-detail'>
                        <span>所属项目</span>
                        <div>${data.name}</div>
                    </div>
                    <div class='item-detail'>
                        <span>开始时间</span>
                        <div>${data.task_begin}</div>
                    </div>
                    <div class='item-detail'>
                        <span>结束时间</span>
                        <div>${data.task_end}</div>
                    </div> `
        document.getElementById(domId).appendChild(child)
    }
    /**添加新任务
     * @param {Event} ev 事件对象
     * @returns {Promise<void>}
     */
    async function addTask (ev) {
        ev.preventDefault()
        var formData = new FormData(document.getElementById('task-form'));
        // console.log(ev,formData.entries());
        //status:-1未分类 0 未开始 1进行中 2已完成 
        const data = { id: new Date().getTime() + '', status: '-1' };
        for (let [name, value] of formData.entries()) {
            data[name] = value
        }
        data.task_begin = formatTime()
        data.task_end = formatTime()

        const res = await addData(db, dbStoreName, data);
        if (!res.success) {
            console.error('添加数据失败', res.msg);
            return;
        }
        toggleModal(ev, false)
        addTaskDom(data)
        unclassifiedDatas.push(data)
    }
    /**打开新建任务窗口
    */
    function toggleModal (ev, visible) {
        const mask = document.querySelector('.mask')
        const taskWrap = document.querySelector('.task-wrap')
        const display = visible ? 'block' : 'none'
        mask.style.display = display
        taskWrap.style.display = display
        // 默认当前时间；
        const dateTime = new Date()
        document.getElementById('datetime1').value = formatTime(dateTime)
        document.getElementById('datetime2').value = formatTime(dateTime)
    }
    
    /**
     * 删除任务
     * @param {Event} ev 事件对象
     * @param {string} id 任务ID
     */
    function deleteTask (ev,status, id) {
        ev.stopPropagation()
        const res = confirm('确定删除吗？')
        if (res) {
            const task = document.getElementById(id)
            const status = task.dataset.status
            const index = {
                '0': todoDatas,
                '1': inprogressDatas,
                '2': donesDatas,
                '-1': unclassifiedDatas
            }
            index[status].splice(index[status].findIndex(item => item.id === id), 1)
            task.remove()
            // console.log('删除任务', id, status);
            deleteData(db, dbStoreName, id+'').then((result) => {
                console.log('删除成功', result);
            }).catch((err) => {
                
            });
        }
    }
    //显示任务列表
    async function getAllDatas () {
        
        await getTodoDatas()
        await getInprogressDatas()
        await getDoneDatas()
        await getUnclassifiedDatas()
        drawPieChart(todoDatas, inprogressDatas, donesDatas, unclassifiedDatas)
    }
    async function getTodoDatas () {
        const res = await getIndexData(db, dbStoreName, 'status', '0')
        if (res.success) {
            todoDatas = res.data

            res.data.forEach(item => {
                addTaskDom(item, 'todo')
            })

            const handler = {
                set (target, key, value) {
                    target[key] = value
                    console.log('数据发生变化', target, key, value)
                    drawPieChart(window.todoDatas, window.inprogressDatas, window.donesDatas, window.unclassifiedDatas)
                    Reflect.set(target, key, value)
                    return true
                }
            }
            window.todoDatas = new Proxy(res.data, handler)
        }
    }
    //显示任务列表
    async function getInprogressDatas () {
        const res = await getIndexData(db, dbStoreName, 'status', '1')
        if (res.success) {
            // window.inprogressDatas = res.data
            res.data.forEach(item => {
                addTaskDom(item, 'inprogress')
            })
            const handler = {
                set (target, key, value) {
                    target[key] = value
                    console.log('数据发生变化', target, key, value)
                    drawPieChart(window.todoDatas, window.inprogressDatas, window.donesDatas, window.unclassifiedDatas)
                    Reflect.set(target, key, value)
                    return true
                }
            }
            window.inprogressDatas = new Proxy(res.data, handler)
        }
    }
    //显示任务列表
    async function getDoneDatas () {
        const res = await getIndexData(db, dbStoreName, 'status', '2')
        if (res.success) {
            // window.donesDatas = res.data
            res.data.forEach(item => {
                addTaskDom(item, 'done')
            })
            const handler = {
                set (target, key, value) {
                    target[key] = value
                    console.log('数据发生变化', target, key, value)
                    drawPieChart(window.todoDatas, window.inprogressDatas, window.donesDatas, window.unclassifiedDatas)
                    Reflect.set(target, key, value)
                    return true
                }
            }
            window.donesDatas = new Proxy(res.data, handler)
        }
    }
    async function getUnclassifiedDatas () {
        const res = await getIndexData(db, dbStoreName, 'status', '-1')
        if (res.success) {
            // window.unclassifiedDatas = res.data
            res.data.forEach(item => {
                addTaskDom(item, 'unclassified')
            })
            const handler = {
                set (target, key, value) {
                    target[key] = value
                    console.log('数据发生变化', target, key, value)
                    drawPieChart(window.todoDatas, window.inprogressDatas, window.donesDatas, window.unclassifiedDatas)
                    Reflect.set(target, key, value)
                    return true
                }
            }
            window.unclassifiedDatas = new Proxy(res.data, handler)
        }
    }
    function drag (ev) {
        ev.dataTransfer.setData("id", ev.target.id);
        ev.dataTransfer.setData("status", ev.target.dataset.status);
        ev.dataTransfer.setData("detail", ev.target.dataset.detail);
        ev.dataTransfer.setData("name", ev.target.dataset.name);
        ev.dataTransfer.setData("begin", ev.target.dataset.begin);
        ev.dataTransfer.setData("end", ev.target.dataset.end);
        // ev.dataTransfer.setData("status", ev.target.dataset.status);
    }
    function allowDrop (ev) {
        ev.preventDefault();
    }
    async function drop (ev, status) {
        ev.preventDefault();
        const id = ev.dataTransfer.getData("id");
        const oldStatus = ev.dataTransfer.getData("status");
        const detail = ev.dataTransfer.getData("detail");
        const name = ev.dataTransfer.getData("name");
        const task_begin = ev.dataTransfer.getData("begin");
        const task_end = ev.dataTransfer.getData("end");
        const res = await updateData(db, dbStoreName, { id, detail, name, task_begin, task_end, status })
        if (res.success) {
            const index = {
                '0': todoDatas,
                '1': inprogressDatas,
                '2': donesDatas,
                '-1': unclassifiedDatas
            }
            ev.target.closest('.kanban-block').appendChild(document.getElementById(id));
            // console.log('数据更新成功', oldStatus, index[oldStatus]);
            index[oldStatus].splice(index[oldStatus].findIndex(item => item.id === id), 1)
            index[status].push({ id, detail, name, task_begin, task_end, status })
        }

        // getAllDatas()

    }
</script>
