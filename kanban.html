<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./kanban.css">
    <title>Kanban Board</title>

</head>

<body>
    <div class="container">
        <div class="kanban-heading">
            <strong class="kanban-heading-text">Kanban Board</strong>
        </div>

        <div class="kanban-board">
            <div class="task-block">
                <div class="task" id="task1" draggable="true" ondragstart="drag(event)">
                    <span>Task 1</span>
                </div>
                <div class="task" id="task2" draggable="true" ondragstart="drag(event)">
                    <span>Task 2</span>
                </div>
                <div class="task" id="task3" draggable="true" ondragstart="drag(event)">
                    <span>Task 3</span>
                </div>
                <div class="task" id="task4" draggable="true" ondragstart="drag(event)">
                    <span>Task 4</span>
                </div>
                <div class="task" id="task5" draggable="true" ondragstart="drag(event)">
                    <span>Task 5</span>
                </div>
                <div class="task" id="task6" draggable="true" ondragstart="drag(event)">
                    <span>Task 6</span>
                </div>
            </div>
            <div class="kanban">
                <div class="kanban-block" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <strong>To Do</strong>
                    <div class="task-button-block">
                        <button id="task-button" onclick="toggleModal(event,true)">Create new task
                    </div>
                </div>
                <div class="kanban-block" id="inprogress" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <strong>In Progress</strong>
                </div>
                <div class="kanban-block" id="done" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <strong>Done</strong>
                </div>
            </div>
        </div>

    </div>
    </div>

<script>
   
    /**添加新任务
    */
    async function addTask (ev) {
        var formData = new FormData(document.getElementById('task-form'));
        console.log(ev,formData.entries());
        const data={id:new Date().getTime()};
        for(let [name,value] of formData.entries()){
            data[name]=value
        }
        console.log(data)
        ev.preventDefault()
        const res = await addData(db, dbStoreName, {id:data.id,value:data});
        if (!res.success) {
            console.error('添加数据失败', res.msg);
            return;
        }
        toggleModal(ev,false)
        const child = document.createElement('div')
        child.className = 'task'
        child.draggable = true
        child.ondragstart = drag
        child.id = data.id
        child.innerHTML = `<span>${data.task_detail}</span>`
        document.getElementById('todo').appendChild(child)

    }
     /**打开新建任务窗口
     */
     function toggleModal (ev,visible) {
        const mask = document.querySelector('.mask')
        const taskWrap = document.querySelector('.task-wrap')
        const display=visible?'block':'none'
        mask.style.display = display
        taskWrap.style.display = display
    }
    function drag (ev) {
        ev.dataTransfer.setData("text", ev.target.id);
    }
    function allowDrop (ev) {
        ev.preventDefault();
    }
    function drop (ev) {
        ev.preventDefault();
        var data = ev.dataTransfer.getData("text");
        ev.target.closest('.kanban-block').appendChild(document.getElementById(data));
    }
</script>
